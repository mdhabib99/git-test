services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-intern-task:local
    container_name: devops-intern-task
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
